<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — TechMart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="/">Tech<span>Mart</span></a>
      <div class="nav-links"><a href="/products.html">Products</a><a href="/products.html">Categories</a></div>
      <div class="nav-actions"><a class="nav-login" href="/login.html">Login</a></div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <p class="eyebrow">Join TechMart</p>
      <h1>Create account</h1>
      <p class="muted">Create an account and enable MFA later from Security & Privacy.</p>

      <form id="registerForm" class="form">
        <label>Full name
          <input type="text" name="name" autocomplete="name" minlength="2" maxlength="80" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="password-help">Use at least 8 characters.</p>
        <div class="form-message" id="registerMessage"></div>
        <button class="button button-primary full-width" type="submit">Create account</button>
      </form>
      <p class="form-footer">Already registered? <a href="/login.html">Sign in</a></p>
    </div>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
