<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TechMart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="/">Tech<span>Mart</span></a>
      <div class="nav-links"><a href="/products.html">Products</a><a href="/products.html">Categories</a></div>
      <div class="nav-actions"><a class="nav-login" href="/register.html">Create account</a></div>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div id="passwordStep">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p class="muted">Use your TechMart account credentials.</p>

        <form id="loginForm" class="form">
          <label>Email
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <div class="form-message" id="loginMessage"></div>
          <button class="button button-primary full-width" type="submit">Login</button>
        </form>
        <p class="form-footer">New to TechMart? <a href="/register.html">Create an account</a></p>
      </div>

      <div id="mfaStep" class="hidden">
        <p class="eyebrow">Second factor</p>
        <h1>Verify MFA</h1>
        <p class="muted">Open your authenticator app and enter the current six-digit code.</p>

        <form id="mfaLoginForm" class="form">
          <label>Authenticator code
            <input class="code-input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required>
          </label>
          <div class="form-message" id="mfaLoginMessage"></div>
          <button class="button button-primary full-width" type="submit">Verify and login</button>
        </form>
        <button class="button button-ghost full-width" id="backToPassword" type="button">Back to password login</button>
      </div>
    </div>
  </main>

  <script src="/js/auth.js" defer></script>
</body>
</html>
