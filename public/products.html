<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — TechMart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="/">Tech<span>Mart</span></a>
      <div class="nav-links">
        <a class="active" href="/products.html">Products</a>
        <a href="/products.html">Categories</a>
      </div>
      <div class="nav-actions">
        <a class="security-status hidden" id="securityStatus" href="/settings.html"></a>
        <button class="cart-button" id="cartButton" type="button">Cart <span id="cartCount">0</span></button>
        <a class="nav-login" id="loginLink" href="/login.html">Login</a>
        <button class="nav-logout hidden" id="logoutButton" type="button">Logout</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">TechMart catalog</p>
        <h1>Products</h1>
        <p>Browse technology for work, study, entertainment and everyday use.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-row">
          <button class="filter-button active" data-category="">All</button>
          <button class="filter-button" data-category="Laptops">Laptops</button>
          <button class="filter-button" data-category="Smartphones">Smartphones</button>
          <button class="filter-button" data-category="Audio">Audio</button>
          <button class="filter-button" data-category="Accessories">Accessories</button>
          <button class="filter-button" data-category="Gaming">Gaming</button>
          <button class="filter-button" data-category="Monitors">Monitors</button>
        </div>
        <div class="product-grid" id="productsGrid">
          <div class="loading">Loading products...</div>
        </div>
      </div>
    </section>
  </main>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-header">
      <h2>Cart</h2>
      <button id="closeCart" class="icon-button" type="button" aria-label="Close cart">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><strong id="cartTotal">₹0</strong></div>
      <button class="button button-primary full-width" id="checkoutButton" type="button">Checkout</button>
    </div>
  </aside>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <script src="/js/app.js" defer></script>
  <script src="/js/products.js" defer></script>
</body>
</html>
